[platformio]
default_envs = jc8012p4a1c

[env:jc8012p4a1c]
; Arduino-ESP32 3.3.8 / ESP-IDF 5.5.4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-p4
framework = arduino
monitor_speed = 115200
upload_speed = 230400

; JC8012P4A1C_I_W_Y hardware configuration.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi

; 16 MB custom partition layout.  The generic ESP32-P4 board defaults to a
; ~1.25 MB application partition, which is too small once Wi-Fi + HTTP + HA
; support are linked.  Keep dual 6 MB OTA slots for future OTA updates.
board_build.partitions = partitions.csv

; Version 1.6.0 targets the user's confirmed rear label:
; SKU 10153001 (2624), model JC8012P4A1C_I_W_Y.
; The pre-build script stages the pinned display driver locally and patches it
; to the JC8012P4A1-V2 JD9365 profile that was proven to eliminate the grey/
; garbled output on this panel family.
extra_scripts =
    pre:scripts/bootstrap_jd9365_2624.py
    pre:scripts/fetch_hosted_c6.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32P4_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_SKIP
    ; v2.0.1: LVGL's default builtin allocator is only a fixed 64 KB pool.
    ; Persistent pages exceed that pool even though this board has abundant PSRAM.
    ; Route LVGL allocations through our ESP32 custom allocator instead.
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CUSTOM
    -DLV_USE_STDLIB_STRING=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_SPRINTF=LV_STDLIB_CLIB
    ; v2.1.0 uses one reusable LVGL image widget per weather icon.
    ; Keep RGB565+A8 support explicit because the compiled icon assets carry
    ; their alpha plane separately from the RGB565 pixels.
    -DLV_USE_IMAGE=1
    -DLV_DRAW_SW_SUPPORT_RGB565A8=1
    -DLV_COLOR_DEPTH=16
    -DLV_DEF_REFR_PERIOD=16
    -DLV_DPI_DEF=130
    -DLV_USE_LOG=1
    -DLV_LOG_LEVEL=LV_LOG_LEVEL_WARN
    -DLV_LOG_PRINTF=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_26=1
    -DLV_FONT_MONTSERRAT_28=1
    ; Arduino-ESP32 3.3.8 WiFi/library.properties does not declare its
    ; Network library dependency.  PlatformIO therefore compiles WiFi without
    ; the framework Network/src include path unless we add it explicitly.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

lib_deps =
    lvgl/lvgl@9.3.0
    bblanchon/ArduinoJson@7.4.3

lib_ldf_mode = deep+
